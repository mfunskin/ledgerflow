name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: gofmt -l ./cmd ./internal | tee /tmp/gofmt.txt && test ! -s /tmp/gofmt.txt
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o ledgerflow ./cmd/ledgerflow
      - run: ./ledgerflow post -journal /tmp/ledgerflow-ci.jsonl -input examples/transactions.jsonl
      - run: ./ledgerflow reconcile -journal /tmp/ledgerflow-ci.jsonl -input examples/statement.jsonl
